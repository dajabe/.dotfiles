# Wayle configuration
#
# Wayle reads this file from ~/.config/wayle/config.toml.
# CLI / Settings UI changes are written to runtime.toml, which is ignored by git.

[general]
font-sans = "Inter"
font-mono = "JetBrains Mono"

[bar]
location = "top"
exclusive = true
layer = "top"
scale = 1
padding = 0
padding-ends = 0
module-gap = 0.5
bg = "transparent"
rounding = "none"
button-rounding = "none"
button-variant = "block-prefix"
button-group-background = "bg-elevated"
button-group-rounding = "none"
button-group-padding = 0.15
button-group-module-gap = 0.25
button-icon-size = 0.85
button-icon-padding = 0.5
button-label-size = 0.9
button-label-padding = 0.5

[[bar.layout]]
monitor = "*"
show = true
left = ["clock", "media"]
center = ["hyprland-workspaces"]
right = [
  "network",
  "microphone",
  "volume",
  "clock",
  "systray",
]

[styling]
scale = 1
rounding = "sm"
theme-provider = "wayle"
matugen-scheme = "tonal-spot"
matugen-light = false

[modules.hyprland-workspaces]
min-workspace-count = 5
monitor-specific = true
show-special = true
display-mode = "icon"
label-use-name = true
numbering = "absolute"
app-icons-show = false
active-indicator = "background"
active-color = "accent"
occupied-color = "fg-muted"
empty-color = "fg-subtle"

[modules.hyprland-workspaces.workspace-map.-98]
icon = "ld-hash-symbolic"

[modules.hyprland-workspaces.workspace-map.1]
icon = "ld-globe-symbolic"
color = "blue"

[modules.hyprland-workspaces.workspace-map.2]
icon = "ld-terminal-symbolic"
color = "green"

[modules.hyprland-workspaces.workspace-map.5]
icon = "ld-music-symbolic"
color = "accent"

[modules.window-title]
format = "{{ title }}"
label-max-length = 80

[modules.clock]
format = "%a %H:%M"

[modules.media]
format = "{{ title }} - {{ artist }}"
label-max-length = 45

[modules.network]
label-max-length = 18

[modules.volume]
format = "{{ percent }}%"
middle-click = "wayle audio output-mute"

[modules.microphone]
middle-click = "wayle audio input-mute"

[modules.cpu]
format = "CPU {{ percent }}%"

[modules.ram]
format = "RAM {{ percent }}%"

[modules.notifications]
right-click = "wayle notify dnd"
popup-position = "bottom-center"
popup-monitor = "primary"

[modules.idle-inhibit]
left-click = "wayle idle toggle --indefinite"
right-click = "wayle idle toggle"

[wallpaper]
engine-enabled = false
