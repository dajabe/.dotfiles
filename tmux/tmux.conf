# ==============================================================================
# Prefix and key handling
# ==============================================================================

# Replace the default Ctrl-b prefix with Ctrl-Space.
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Improve support for modified and extended key combinations.
set -g extended-keys on
set -g extended-keys-format csi-u


# ==============================================================================
# Pane controls
# ==============================================================================

# Prefix + Ctrl-r: kill and recreate the current pane using its original command.
bind C-r respawn-pane -k

# Keep panes visible after their process exits.
set -g remain-on-exit on


# ==============================================================================
# Mouse and copy-mode behaviour
# ==============================================================================

# Enable tmux mouse support for pane selection, resizing, and copy mode.
set -g mouse on

# Copy selections to the system clipboard without clearing the selection.
# Alternative actions:
#   copy-selection-no-clear  - copy only to a tmux buffer
#   copy-pipe-and-cancel     - copy to the system clipboard and exit copy mode
set -g @yank_action 'copy-pipe-no-clear'

# Middle-click while in vi copy mode clears the current selection but leaves
# copy mode active and preserves the current scroll position.
bind -T copy-mode-vi MouseDown2Pane send-keys -X clear-selection


# ==============================================================================
# Windows and sessions
# ==============================================================================

# Number windows from 1 rather than 0.
set -g base-index 1

# Stay attached when the current session is destroyed.
set -g detach-on-destroy off

# Disable tmux-sessionist's default goto binding.
set -g @sessionist-goto ' '

# Prefix + g: select a session using an fzf popup.
bind g display-popup -E "tmux list-sessions | sed -E 's/:.*$//' | fzf --reverse | xargs tmux switch-client -t"

# Replace tmux-sessionist's Shift-s binding with Prefix + Ctrl-s for switching
# to the previously used session.
unbind S
bind C-s switch-client -l


# ==============================================================================
# Terminal capabilities
# ==============================================================================

# Advertise tmux-specific 256-colour support inside tmux.
set -g default-terminal "tmux-256color"

# Enable true-colour output and cursor-shape changes.
set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[ q'
set-option -a terminal-features 'tmux-256color:RGB'
set-environment -g COLORTERM "truecolor"

# Allow supported escape sequences to pass through tmux to the terminal.
set -g allow-passthrough on


# ==============================================================================
# Vague status-line configuration
# ==============================================================================

source-file ~/.config/tmux/vague.conf


# ==============================================================================
# TPM plugins
# ==============================================================================

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-sessionist'
set -g @plugin 'akohlbecker/aw-watcher-tmux'
set -g @plugin 'jaclu/tmux-menus'

# Keep this as the final command so TPM loads after all plugin declarations and
# plugin options have been configured. Prefer TPM's default location, but keep
# loading the old dotfiles-adjacent location while machines are migrated.
if-shell 'test -f ~/.tmux/plugins/tpm/tpm' \
  'set-environment -g TMUX_PLUGIN_MANAGER_PATH "~/.tmux/plugins/"; run "~/.tmux/plugins/tpm/tpm"' \
  'if-shell "test -f ~/.config/tmux/plugins/tpm/tpm" "set-environment -g TMUX_PLUGIN_MANAGER_PATH \"~/.config/tmux/plugins/\"; run \"~/.config/tmux/plugins/tpm/tpm\""'

# ==============================================================================
# TPM plugin overrides
# ==============================================================================
#
# When plugins don't provide configuration options for certain settings override
# them here.

# Middle-click in a normal pane should paste the Wayland PRIMARY selection
# rather than tmux's internal paste buffer, preserving mouse forwarding in
# copy-mode and applications that have mouse reporting enabled.
bind -T root MouseDown2Pane select-pane -t = \; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { run-shell -b 'wl-paste --primary | tmux load-buffer -b primary - && tmux paste-buffer -p -b primary -t "#{pane_id}"' }

# I don't want the ctrl+vimkey movements from tmux-pain-control.
unbind C-h
unbind C-j
unbind C-k
unbind C-l
# Prefix + Ctrl-k: reset the terminal and clear the current pane's history.
bind C-k send-keys -R \; clear-history
# bind C-l send-keys C-l \; clear-history
bind C-l send-keys C-l \; run-shell 'sleep 0.2' \; clear-history
