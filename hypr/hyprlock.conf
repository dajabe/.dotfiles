general {
    disable_loading_bar = true
    hide_cursor = true
}

background {
    monitor =
    color = rgba(1e1e2eff)
}

input-field {
    monitor =
    size = 300, 55
    outline_thickness = 1

    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true

    outer_color = rgba(89b4faff)
    inner_color = rgba(1e1e2eff)
    font_color = rgba(cdd6f4ff)
    fail_color = rgba(f38ba8ff)
    check_color = rgba(a6e3a1ff)

    fade_on_empty = false
    # placeholder_text = <i>Password</i>

    position = 0, -40
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(cdd6f4ff)
    font_size = 64
    font_family = sans-serif

    position = 0, 80
    halign = center
    valign = center
}
