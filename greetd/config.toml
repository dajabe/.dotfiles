[terminal]
vt = 1

[default_session]
# TUI greeter: do not run Hyprland as the greeter compositor.
# Hyprland is launched only after successful login. Use uwsm so user services
# inherit the Wayland/Hyprland session environment correctly.
command = "tuigreet --time --asterisks --remember --remember-session --sessions /usr/share/wayland-sessions --cmd 'uwsm start -e -D Hyprland hyprland.desktop'"
user = "greeter"
